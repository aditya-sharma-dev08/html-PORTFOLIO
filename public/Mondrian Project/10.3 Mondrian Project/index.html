<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mondrian Project</title>
  <style>
    .container{display: grid;
    grid-template-columns: 320px 198px 153px 50px;
    grid-template-rows: 414px 130px 155px 20px ;
    gap: 9px;
    background-color: black;
    height: 748px;
    width: 748px;
  }
    .first{
  background-color: #E72F24;
           }
    .second{ background-color: #F0F1EC;
grid-column: span 3;}
  .third{background-color: #F0F1EC;
grid-row: span 2;}
.fourth{background-color: #F0F1EC;
  grid-column: span 2;
  grid-row: span 2;
}
.fifth{ border: 10px solid black;
   border-width: 0 0 10px 0;
background-color: #004592;
}
.sixth{
background-color: #F0F1EC;
grid-row: span 2;}
.seventh{
background-color: #F0F1EC;}
.eighth{
background-color: #F9D01E;}
.ninth{
background-color: #232629;
}
  </style>
</head>

<body>
   <div class="container">
    <div class="box first"></div>
    <div class="box second"></div>
    <div class="box third"></div>
    <div class="box fourth"></div>
    <div class="box fifth"></div>
    <div class="box sixth"></div>
    <div class="box seventh"></div>
    <div class="box eighth"></div>
    <div class="box ninth"></div>
</body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>CSS Flag Project</title>
    <style>
      /* Write your CSS Code here */
      .flag {
        height: 600px;
        width: 900px;
        background-color: red;
        font-size: 75px;
        text-align: center;
        position: relative;
      }
      .flag > div {
        background-color: blue;
        width: 900px;
        height: 300px;
        position: absolute;
        top: 150px;
      }
      .flag div > div {
        height: 200px;
        width: 200px;
        border-radius: 50%;
        background-color: white;
        position: absolute;
        top: 50px;
        left: 350px;
      }
      .flag > p {
        margin: 0;
        color: white;
        font-size: 100%;
      }
      .flag div > div > p {
        margin: 0;
        font-size: 100%;
      }
    </style>
  </head>

  <body>
    <div class="flag">
      <p>The Flag</p>
      <div>
        <div>
          <p>of Laos</p>
        </div>
      </div>
    </div>
  </body>
</html>
